<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="kraftLidGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#EED8B6"/>
      <stop offset="65%" stop-color="#DCBE94"/>
      <stop offset="90%" stop-color="#C7A376"/>
      <stop offset="100%" stop-color="#AF895C"/>
    </radialGradient>
    <radialGradient id="stickerGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#24786D"/>
      <stop offset="100%" stop-color="#14524A"/>
    </radialGradient>
    <filter id="lidShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="25" flood-color="#1E1914" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1E1914" flood-opacity="0.2"/>
    </filter>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Outer Kraft Paperboard Lid with 3D bevels -->
  <circle cx="250" cy="250" r="235" fill="url(#kraftLidGrad)" filter="url(#lidShadow)"/>
  <!-- Embossed outer rim groove -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="#FAF1E0" stroke-width="2.5" opacity="0.6"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#9E784D" stroke-width="2" opacity="0.5"/>
  <circle cx="250" cy="250" r="195" fill="none" stroke="#FAF1E0" stroke-width="1.5" opacity="0.4"/>

  <!-- Curved Editorial Typography along lid -->
  <path id="curveTop" d="M 100 250 A 150 150 0 0 1 400 250" fill="none"/>
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#8C663D" letter-spacing="4px" opacity="0.75">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">
      CRAFTED FRESH DAILY · BOWL LAB · PURE FLAVOUR
    </textPath>
  </text>

  <path id="curveBottom" d="M 400 250 A 150 150 0 0 1 100 250" fill="none"/>
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#8C663D" letter-spacing="3.5px" opacity="0.75">
    <textPath href="#curveBottom" startOffset="50%" text-anchor="middle">
      MADE TO ORDER · 100% QUALITY INGREDIENTS
    </textPath>
  </text>

  <!-- Central Seal Sticker -->
  <circle cx="250" cy="250" r="105" fill="url(#stickerGrad)" filter="url(#stickerShadow)"/>
  <circle cx="250" cy="250" r="100" fill="none" stroke="#3DA395" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Sticker Logo and Text -->
  <!-- Wave Accent -->
  <path d="M225 210 C233 205 241 205 250 210 C259 215 267 215 275 210" stroke="#F15A35" stroke-width="4" stroke-linecap="round"/>
  <text x="250" y="248" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#FFFDF7" text-anchor="middle" letter-spacing="-0.03em">bowl</text>
  <text x="250" y="275" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#F2DCA5" text-anchor="middle" letter-spacing="-0.03em">lab</text>
  <text x="250" y="296" font-family="system-ui, sans-serif" font-weight="700" font-size="8.5" fill="#FFFDF7" text-anchor="middle" letter-spacing="2px" opacity="0.8">POKE &amp; FRESH BOWLS</text>
</svg>