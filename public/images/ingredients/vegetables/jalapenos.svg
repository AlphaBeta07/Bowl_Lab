<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="jalDrop" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#0E2B08" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#jalDrop)">
    <!-- Ring 1 -->
    <g transform="translate(25, 30)">
      <ellipse cx="40" cy="40" rx="36" ry="34" fill="#2E7D19"/>
      <ellipse cx="40" cy="40" rx="26" ry="24" fill="#67B83B"/>
      <ellipse cx="40" cy="40" rx="16" ry="14" fill="#FAF6EE"/>
      <!-- Seeds in center -->
      <circle cx="36" cy="38" r="3" fill="#D6C685"/>
      <circle cx="44" cy="42" r="2.8" fill="#D6C685"/>
      <circle cx="42" cy="34" r="2.8" fill="#D6C685"/>
      <!-- Glossy highlight arc -->
      <path d="M 18 30 A 28 26 0 0 1 55 16" stroke="#96EA65" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/>
    </g>
    <!-- Ring 2 -->
    <g transform="translate(70, 70) rotate(-15 30 30)">
      <ellipse cx="30" cy="30" rx="28" ry="26" fill="#2E7D19"/>
      <ellipse cx="30" cy="30" rx="20" ry="18" fill="#67B83B"/>
      <ellipse cx="30" cy="30" rx="12" ry="10" fill="#FAF6EE"/>
      <circle cx="28" cy="28" r="2.5" fill="#D6C685"/>
      <circle cx="33" cy="32" r="2.5" fill="#D6C685"/>
    </g>
  </g>
</svg>