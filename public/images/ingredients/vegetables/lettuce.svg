<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="letDrop" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#142B0A" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="letGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D9F5B5"/>
      <stop offset="40%" stop-color="#9DE051"/>
      <stop offset="100%" stop-color="#55B318"/>
    </linearGradient>
  </defs>
  <g filter="url(#letDrop)">
    <!-- Ruffled Leaf 1 -->
    <path d="M 75 135 C 50 120, 30 100, 25 75 C 20 50, 40 30, 65 35 C 80 20, 115 25, 125 45 C 140 65, 135 100, 95 130 Z" fill="url(#letGrad)"/>
    <!-- Leaf veins -->
    <path d="M 80 130 Q 75 80 75 42" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M 75 85 Q 55 75 42 70" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 75 70 Q 100 60 115 55" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>