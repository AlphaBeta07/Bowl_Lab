<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="bpDrop" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#2D1107" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="redPep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C5C"/>
      <stop offset="60%" stop-color="#E61E1E"/>
      <stop offset="100%" stop-color="#A80D0D"/>
    </linearGradient>
    <linearGradient id="yelPep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE853"/>
      <stop offset="60%" stop-color="#F5B800"/>
      <stop offset="100%" stop-color="#BF8200"/>
    </linearGradient>
  </defs>
  <g filter="url(#bpDrop)">
    <!-- Red strip -->
    <path d="M 25 110 C 35 60, 65 30, 115 25 C 122 30, 125 42, 110 50 C 75 58, 55 80, 45 118 C 38 122, 28 120, 25 110 Z" fill="url(#redPep)"/>
    <path d="M 32 100 C 45 62, 72 40, 110 32" stroke="#FFA3A3" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- Yellow strip -->
    <path d="M 40 130 C 55 85, 85 55, 135 50 C 142 55, 142 66, 128 75 C 92 82, 72 105, 62 138 C 52 142, 42 140, 40 130 Z" fill="url(#yelPep)"/>
    <path d="M 48 120 C 62 88, 88 65, 128 58" stroke="#FFF7B8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
</svg>