      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#3D2910" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="chickGrad1" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FCE1A9"/>
      <stop offset="55%" stop-color="#E2B86E"/>
      <stop offset="85%" stop-color="#C49344"/>
      <stop offset="100%" stop-color="#9E6F25"/>
    </radialGradient>
  </defs>
  <g filter="url(#chickDrop)">
    <!-- Chickpea 1 -->
    <g transform="translate(25, 45)">
      <path d="M 25 10 C 35 10, 48 22, 45 35 C 42 48, 30 52, 20 48 C 8 42, 5 28, 12 18 C 16 12, 20 10, 25 10 Z" fill="url(#chickGrad1)"/>
