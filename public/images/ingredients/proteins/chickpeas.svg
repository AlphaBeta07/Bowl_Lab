      <path d="M 28 12 C 38 12, 50 25, 46 38 C 42 50, 28 54, 18 48 C 6 42, 6 25, 15 16 C 20 12, 24 12, 28 12 Z" fill="url(#chickGrad1)"/>
      <path d="M 26 14 Q 25 28 32 34" stroke="#8A5E1C" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
      <ellipse cx="30" cy="22" rx="6" ry="3" fill="#FFF5DF" opacity="0.6"/>
    </g>
    <!-- Chickpea 3 -->
    <g transform="translate(48, 85)">
      <path d="M 25 10 C 35 10, 48 22, 45 35 C 42 48, 30 52, 20 48 C 8 42, 5 28, 12 18 C 16 12, 20 10, 25 10 Z" fill="url(#chickGrad1)"/>
      <path d="M 24 12 Q 22 25 30 32" stroke="#8A5E1C" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
      <ellipse cx="28" cy="20" rx="6" ry="3" fill="#FFF5DF" opacity="0.6"/>
