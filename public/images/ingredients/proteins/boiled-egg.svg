<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="eggDrop" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="3.5" flood-color="#2D2214" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="eggYolk" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFDD55"/>
      <stop offset="50%" stop-color="#FF9900"/>
      <stop offset="90%" stop-color="#E66000"/>
      <stop offset="100%" stop-color="#CC4E00"/>
    </radialGradient>
    <linearGradient id="eggWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F9F6EE"/>
      <stop offset="100%" stop-color="#ECE5D6"/>
    </linearGradient>
  </defs>
  <g filter="url(#eggDrop)">
    <!-- Egg Half 1 -->
    <g transform="translate(18, 20) rotate(-15 45 60)">
      <ellipse cx="45" cy="60" rx="36" ry="48" fill="url(#eggWhite)"/>
      <circle cx="45" cy="65" r="22" fill="url(#eggYolk)"/>
      <!-- Yolk glossy specular highlight -->
      <ellipse cx="38" cy="56" rx="6" ry="3.5" fill="#FFFFFF" opacity="0.75" transform="rotate(-20 38 56)"/>
    </g>
    <!-- Egg Half 2 -->
    <g transform="translate(75, 40) rotate(25 40 50)">
      <ellipse cx="40" cy="50" rx="32" ry="44" fill="url(#eggWhite)"/>
      <circle cx="40" cy="55" r="19" fill="url(#eggYolk)"/>
      <ellipse cx="34" cy="48" rx="5" ry="3" fill="#FFFFFF" opacity="0.75" transform="rotate(-15 34 48)"/>
    </g>
  </g>
</svg>