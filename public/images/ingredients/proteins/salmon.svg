<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="salDrop" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="3.5" flood-color="#3A1208" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#salDrop)">
    <!-- Salmon Cube 1 -->
    <g transform="translate(20, 20)">
      <polygon points="10,25 35,10 60,25 35,40" fill="#FFA585"/>
      <polygon points="10,25 35,40 35,65 10,50" fill="#E86542"/>
      <polygon points="35,40 60,25 60,50 35,65" fill="#C94724"/>
      <!-- Fat striation lines -->
      <line x1="18" y1="20" x2="43" y2="35" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
      <line x1="28" y1="15" x2="53" y2="30" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- Salmon Cube 2 -->
    <g transform="translate(80, 25)">
      <polygon points="10,25 35,10 60,25 35,40" fill="#FFA585"/>
      <polygon points="10,25 35,40 35,65 10,50" fill="#E86542"/>
      <polygon points="35,40 60,25 60,50 35,65" fill="#C94724"/>
      <line x1="18" y1="20" x2="43" y2="35" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- Salmon Cube 3 -->
    <g transform="translate(35, 75)">
      <polygon points="10,25 35,10 60,25 35,40" fill="#FFA585"/>
      <polygon points="10,25 35,40 35,65 10,50" fill="#E86542"/>
      <polygon points="35,40 60,25 60,50 35,65" fill="#C94724"/>
      <line x1="18" y1="20" x2="43" y2="35" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- Salmon Cube 4 -->
    <g transform="translate(85, 80)">
      <polygon points="10,25 35,10 60,25 35,40" fill="#FFA585"/>
      <polygon points="10,25 35,40 35,65 10,50" fill="#E86542"/>
      <polygon points="35,40 60,25 60,50 35,65" fill="#C94724"/>
      <line x1="18" y1="20" x2="43" y2="35" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    </g>
  </g>
</svg>