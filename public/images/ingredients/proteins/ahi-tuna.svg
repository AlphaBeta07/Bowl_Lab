<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="tunaDrop" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="3.5" flood-color="#30050E" flood-opacity="0.32"/>
    </filter>
  </defs>
  <g filter="url(#tunaDrop)">
    <!-- Tuna Cube 1 -->
    <g transform="translate(20, 20)">
      <polygon points="10,25 35,10 60,25 35,40" fill="#E62E52"/>
      <polygon points="10,25 35,40 35,65 10,50" fill="#B20F30"/>
      <polygon points="35,40 60,25 60,50 35,65" fill="#80041D"/>
      <circle cx="32" cy="28" r="4" fill="#FFFFFF" opacity="0.3"/>
    </g>

    <!-- Tuna Cube 2 -->
    <g transform="translate(80, 25)">
      <polygon points="10,25 35,10 60,25 35,40" fill="#E62E52"/>
      <polygon points="10,25 35,40 35,65 10,50" fill="#B20F30"/>
      <polygon points="35,40 60,25 60,50 35,65" fill="#80041D"/>
    </g>

    <!-- Tuna Cube 3 -->
    <g transform="translate(45, 80)">
      <polygon points="10,25 35,10 60,25 35,40" fill="#E62E52"/>
      <polygon points="10,25 35,40 35,65 10,50" fill="#B20F30"/>
      <polygon points="35,40 60,25 60,50 35,65" fill="#80041D"/>
    </g>
  </g>
</svg>