<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="shrimpDrop" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="3.5" flood-color="#3D0B0B" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="shrimpCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A7A"/>
      <stop offset="40%" stop-color="#FF5D47"/>
      <stop offset="80%" stop-color="#E83B23"/>
      <stop offset="100%" stop-color="#C2200A"/>
    </linearGradient>
  </defs>
  <g filter="url(#shrimpDrop)">
    <!-- Shrimp 1 (Curled) -->
    <g transform="translate(15, 15)">
      <!-- Body curve -->
      <path d="M 35 75 C 15 50, 25 15, 60 15 C 95 15, 115 45, 95 80 C 85 95, 65 95, 55 85 C 45 75, 50 60, 60 55 C 72 50, 80 60, 78 70" 
            fill="none" stroke="url(#shrimpCoral)" stroke-width="22" stroke-linecap="round"/>
      <!-- Inner white belly glow -->
      <path d="M 40 65 C 30 45, 40 25, 65 25 C 85 25, 95 45, 85 70" 
            fill="none" stroke="#FFF2EE" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
      <!-- Pink Segment bands -->
      <path d="M 38 35 Q 52 38 58 28" stroke="#D12611" stroke-width="3" fill="none"/>
      <path d="M 55 22 Q 68 28 75 18" stroke="#D12611" stroke-width="3" fill="none"/>
      <path d="M 78 22 Q 88 32 98 25" stroke="#D12611" stroke-width="3" fill="none"/>
      <path d="M 90 42 Q 95 55 102 52" stroke="#D12611" stroke-width="3" fill="none"/>
      <!-- Tail fan -->
      <path d="M 35 75 L 18 92 C 15 95, 22 100, 28 94 L 38 80 Z" fill="#E83B23"/>
      <path d="M 32 78 L 26 102 C 30 106, 36 100, 40 90 L 42 82 Z" fill="#C2200A"/>
      <!-- Red chili flakes -->
      <circle cx="68" cy="35" r="2.5" fill="#800000"/>
      <circle cx="85" cy="50" r="2" fill="#800000"/>
      <circle cx="50" cy="52" r="2.2" fill="#800000"/>
    </g>
  </g>
</svg>