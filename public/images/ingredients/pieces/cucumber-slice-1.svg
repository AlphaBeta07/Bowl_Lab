<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="70" height="70">
  <defs>
    <filter id="cucShad1" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#0F2B14" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#cucShad1)">
    <!-- Dark green skin ring -->
    <circle cx="35" cy="35" r="30" fill="#205524"/>
