    <circle cx="35" cy="35" r="27" fill="#E4F5DE"/>
    <!-- Soft seed ring -->
    <circle cx="35" cy="35" r="16" fill="#D0ECC4" stroke="#B1D99C" stroke-width="1.8" stroke-dasharray="3 2"/>
    <!-- Tiny seeds -->
    <ellipse cx="32" cy="27" rx="3.5" ry="1.2" fill="#9CC985" transform="rotate(30 32 27)"/>
    <ellipse cx="40" cy="30" rx="3.5" ry="1.2" fill="#9CC985" transform="rotate(-40 40 30)"/>
    <ellipse cx="33" cy="41" rx="3.5" ry="1.2" fill="#9CC985" transform="rotate(70 33 41)"/>
    <ellipse cx="39" cy="39" rx="3.5" ry="1.2" fill="#9CC985" transform="rotate(-15 39 39)"/>
  </g>
</svg>