    <path d="M 60 120 C 120 70, 160 180, 210 110 C 260 50, 290 160, 240 220 C 190 280, 110 200, 80 260 C 60 290, 150 320, 220 290" 
          stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.45"/>
  </g>
</svg>