<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="sesameShadow1" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="2" dy="4.5" stdDeviation="4" flood-color="#422B03" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#sesameShadow1)">
    <!-- Sweeping S-waves across opposing diagonal -->
    <path d="M 110 290 
             C 140 230, 190 290, 230 240 
             C 270 190, 220 140, 275 105 
             M 135 320 
             C 195 280, 160 200, 225 170 
             C 285 140, 310 180, 335 130"
          stroke="#D99B16" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 110 290 
             C 140 230, 190 290, 230 240 
             C 270 190, 220 140, 275 105 
             M 135 320 
             C 195 280, 160 200, 225 170 
             C 285 140, 310 180, 335 130"
          stroke="#FFF7D6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
    <!-- Sesame speckles -->
    <circle cx="170" cy="260" r="4" fill="#D99B16"/>
    <circle cx="260" cy="180" r="4.5" fill="#D99B16"/>
    <circle cx="210" cy="140" r="3.5" fill="#D99B16"/>
  </g>
</svg>