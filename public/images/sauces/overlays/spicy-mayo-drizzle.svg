<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="mayoShadow1" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="2" dy="5" stdDeviation="4.5" flood-color="#401005" flood-opacity="0.38"/>
    </filter>
  </defs>
  <g filter="url(#mayoShadow1)">
    <!-- Dense diagonal zig-zag ribbon from top-left to bottom-right -->
    <path d="M 95 120 
             C 140 100, 160 160, 205 130 
             C 250 100, 275 180, 315 150 
             C 335 170, 295 220, 250 200 
             C 205 180, 180 250, 140 230 
             C 100 210, 110 280, 175 295 
             C 225 310, 265 270, 305 300"
          stroke="#F15A35" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Creamy specular shine on top of ribbon -->
    <path d="M 95 120 
             C 140 100, 160 160, 205 130 
             C 250 100, 275 180, 315 150 
             C 335 170, 295 220, 250 200 
             C 205 180, 180 250, 140 230 
             C 100 210, 110 280, 175 295 
             C 225 310, 265 270, 305 300"
          stroke="#FFF2EB" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
    <!-- Small appetizing sauce droplets -->
    <circle cx="115" cy="180" r="4.5" fill="#F15A35"/>
    <circle cx="280" cy="120" r="4" fill="#F15A35"/>
    <circle cx="210" cy="245" r="5" fill="#F15A35"/>
    <circle cx="145" cy="305" r="4" fill="#F15A35"/>
  </g>
</svg>