<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="diagonal-stripes" patternUnits="userSpaceOnUse" width="28" height="28" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="#FFFDF7"/>
      <line x1="0" y1="0" x2="0" y2="28" stroke="#E66A4E" stroke-width="3.5" opacity="0.6"/>
      <line x1="14" y1="0" x2="14" y2="28" stroke="#5E8357" stroke-width="2.5" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#diagonal-stripes)"/>
</svg>